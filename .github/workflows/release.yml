name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted Publishing (OIDC): the PyPI publisher is bound to this
    # environment, whose required reviewer gates every upload.
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Check, test, and build
        run: |
          uv run python -m compileall -q src scripts
          uv run python -m unittest discover -s tests -v
          uv build
      - name: Validate release wheel
        run: |
          uv venv .release-venv
          uv pip install --python .release-venv/bin/python dist/*.whl
          .release-venv/bin/codex-reset-watch --help
          .release-venv/bin/crw --help
          # The wheel must report the version being tagged, so a tag that
          # disagrees with __version__ in __init__.py fails before anything reaches PyPI.
          reported="$(.release-venv/bin/crw --version)"
          expected="codex-reset-watch ${GITHUB_REF_NAME#v}"
          if [ "$reported" != "$expected" ]; then
            echo "::error::wheel reports '$reported', expected '$expected'"
            exit 1
          fi
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      # After publish: uv publish uploads dist/*, and SHA256SUMS is not a distribution.
      # Attach release artifacts after publication. The in-app update check
      # reads PyPI directly, independent of when a GitHub release is created.
      - name: Create checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/$GITHUB_REF_NAME" >/dev/null
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME" --verify-tag
          fi
