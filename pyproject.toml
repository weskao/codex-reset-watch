[project]
name = "codex-reset-watch"
version = "0.7.0"
description = "Cross-platform monitor for codex-resets.com with Telegram notifications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telegram-kit",
]

[project.scripts]
codex-reset-watch = "codex_reset_watch:main"
crw = "codex_reset_watch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_reset_watch"]

[tool.uv.sources]
telegram-kit = { git = "https://github.com/weskao/telegram-kit", rev = "v0.1.0" }
