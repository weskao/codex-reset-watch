[project]
name = "codex-reset-watch"
dynamic = ["version"]
description = "Cross-platform monitor for codex-resets.com with Telegram notifications."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Wes Kao" }]
dependencies = [
    "telegram-kit>=0.2.2,<0.3",
]

[project.scripts]
codex-reset-watch = "codex_reset_watch:main"
crw = "codex_reset_watch:main"

[project.urls]
Repository = "https://github.com/weskao/codex-reset-watch"
Issues = "https://github.com/weskao/codex-reset-watch/issues"
Changelog = "https://github.com/weskao/codex-reset-watch/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/codex_reset_watch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_reset_watch"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
